# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line, check the file path for "gradle.properties" or use "-Pname=value" command line arg.
# app/build.gradle properties can include Android-specific options.
# For details on library vs application defaults, see
#   https://docs.gradle.org/current/plugins/java_library_plugin.html#sec:java_library_recognition

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and does not include a dependency's R class.
android.nonTransitiveRClass=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enable Gradle Configuration Cache
org.gradle.configuration-cache=true

# Use properties to avoid duplication
android.compileSdk=35
android.minSdk=24
android.targetSdk=35
android.useAndroidX=true
